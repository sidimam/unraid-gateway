services:
  unraid-gateway:
    image: ghcr.io/sidimam/unraid-gateway:latest
    container_name: unraid-gateway
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      UNRAID_URL: "http://192.168.1.10"   # LAN address of the Unraid WebGUI
      # UNRAID_INSECURE_TLS: "true"       # only if UNRAID_URL is https with a self-signed cert
      READ_ONLY: "false"
      SESSION_TTL: "12h"
      MAX_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT: "15m"
      TRUST_PROXY: "false"                 # set true when behind NPM/SWAG/Cloudflare Tunnel
      USER_AUTH: "optional"                # optional | required | off (Unraid user + password on top of the API key)
      TZ: "Europe/Rome"
    volumes:
      # Expose only the shares you want reachable from your phone.
      # Each mount becomes a top-level folder in the Files app; append :ro for read-only.
      - /mnt/user/documents:/data/documents
      - /mnt/user/media:/data/media
      - /mnt/user/downloads:/data/downloads
      # - /mnt/user/programs:/data/programs
      # Never map Time Machine shares: sparsebundles are useless on iOS and easy to corrupt.
      # Unraid share security settings, so user logins get the same permissions as over SMB:
      - /boot/config/shares:/unraid-shares:ro
