<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2a2a"/>
      <stop offset="1" stop-color="#151414"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8c2f"/>
      <stop offset="1" stop-color="#e22828"/>
    </linearGradient>
    <linearGradient id="fireArrow" gradientUnits="userSpaceOnUse" x1="262" y1="262" x2="420" y2="338">
      <stop offset="0" stop-color="#ff8c2f"/>
      <stop offset="1" stop-color="#e22828"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <!-- array bars: stylised disks in the Unraid palette -->
  <g fill="url(#fire)" filter="url(#glow)">
    <rect x="96"  y="132" width="40" height="248" rx="14"/>
    <rect x="152" y="108" width="40" height="296" rx="14"/>
    <rect x="208" y="156" width="40" height="200" rx="14"/>
  </g>
  <!-- gateway: arch -->
  <path d="M296 380 V228 a76 76 0 0 1 152 0 V380" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="26" stroke-linecap="round"/>
  <!-- arrow passing through the gate -->
  <g stroke="url(#fireArrow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="262" y1="300" x2="416" y2="300"/>
    <polyline points="378,262 418,300 378,338"/>
  </g>
</svg>
